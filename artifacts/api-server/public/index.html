<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NinjaOne Control Panel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-brand">NinjaOne <span>Control Panel</span></div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="main">
    <!-- Left panel: Instances -->
    <div class="panel">
      <h2>Instances</h2>
      <div id="instances-list"></div>

      <!-- Add instance -->
      <button class="collapsible-trigger" id="add-toggle">
        + Add instance <span class="arrow">▾</span>
      </button>
      <div class="collapsible-body" id="add-form-wrap">
        <div id="add-error" class="alert alert-error hidden"></div>
        <div id="add-success" class="alert alert-success hidden"></div>
        <form id="add-instance-form">
          <div class="field">
            <label>Display name</label>
            <input type="text" name="name" placeholder="Contoso EU" required />
          </div>
          <div class="field">
            <label>API base URL</label>
            <input type="url" name="apiBase" placeholder="https://eu.ninjarmm.com" required />
          </div>
          <div class="field">
            <label>Auth URL (OAuth token host)</label>
            <input type="url" name="authUrl" placeholder="https://remote.rmmservice.eu" required />
          </div>
          <div class="field">
            <label>Client ID</label>
            <input type="text" name="clientId" required autocomplete="off" />
          </div>
          <div class="field">
            <label>Client Secret</label>
            <input type="password" name="clientSecret" required autocomplete="off" />
          </div>
          <div class="field">
            <label>Scope</label>
            <input type="text" name="scope" value="management control monitoring" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full">Save instance</button>
        </form>
      </div>
    </div>

    <!-- Right content: Actions -->
    <div class="content">
      <!-- Instance selector -->
      <div class="instance-select-row">
        <label>Active instance:</label>
        <select id="active-instance">
          <option value="">— select an instance —</option>
        </select>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="end-users">End Users</button>
        <button class="tab-btn" data-tab="technicians">Technicians</button>
        <button class="tab-btn" data-tab="devices">Devices</button>
        <button class="tab-btn" data-tab="report">Device-User Report</button>
      </div>

      <!-- End Users tab -->
      <div class="tab-pane active" id="tab-end-users">
        <div class="section-heading">Search end users</div>
        <div style="display:flex;gap:8px;margin-bottom:20px;">
          <input type="text" id="eu-search-email" placeholder="Search by email…" style="max-width:300px;" />
          <button class="btn btn-primary" id="eu-search-btn">Search</button>
        </div>
        <div id="eu-search-result"></div>

        <div class="section-heading" style="margin-top:28px;">Create end user</div>
        <div id="eu-create-error" class="alert alert-error hidden"></div>
        <div id="eu-create-success" class="alert alert-success hidden"></div>
        <form id="create-eu-form">
          <div class="row">
            <div class="field"><label>First name</label><input type="text" name="firstName" required /></div>
            <div class="field"><label>Last name</label><input type="text" name="lastName" required /></div>
          </div>
          <div class="row">
            <div class="field"><label>Email</label><input type="email" name="email" required /></div>
            <div class="field"><label>Role name (optional)</label><input type="text" name="roleName" placeholder="e.g. Standard User" /></div>
          </div>
          <button type="submit" class="btn btn-primary">Create end user</button>
        </form>
      </div>

      <!-- Technicians tab -->
      <div class="tab-pane" id="tab-technicians">
        <div class="section-heading">Create technician</div>
        <div id="tech-create-error" class="alert alert-error hidden"></div>
        <div id="tech-create-success" class="alert alert-success hidden"></div>
        <form id="create-tech-form">
          <div class="row">
            <div class="field"><label>First name</label><input type="text" name="firstName" required /></div>
            <div class="field"><label>Last name</label><input type="text" name="lastName" required /></div>
          </div>
          <div class="row">
            <div class="field"><label>Email</label><input type="email" name="email" required /></div>
            <div class="field"><label>Role name (optional)</label><input type="text" name="roleName" placeholder="e.g. Admin" /></div>
          </div>
          <button type="submit" class="btn btn-primary">Create technician</button>
        </form>
      </div>

      <!-- Devices tab -->
      <div class="tab-pane" id="tab-devices">
        <div class="section-heading">Find device</div>
        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <input type="text" id="dev-search-name" placeholder="Device name or partial name…" style="max-width:340px;" />
          <button class="btn btn-primary" id="dev-search-btn">Search</button>
        </div>
        <div id="dev-search-result"></div>
      </div>

      <!-- Device-User Report tab -->
      <div class="tab-pane" id="tab-report">
        <div class="section-heading">Device-User Mapping Report</div>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">
          Fetches all devices and end users and joins them in-memory. Rows with stale device IDs show "(device not found)".
        </p>
        <div style="display:flex;gap:8px;margin-bottom:20px;">
          <button class="btn btn-primary" id="report-view-btn">View as table</button>
          <button class="btn btn-ghost" id="report-csv-btn">Download CSV</button>
        </div>
        <div id="report-result"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== State =====
let csrfToken = sessionStorage.getItem('csrfToken') || '';
let instances = [];

// ===== Helpers =====
async function apiFetch(url, opts = {}) {
  const method = opts.method || 'GET';
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
    headers['X-CSRF-Token'] = csrfToken;
  }
  const res = await fetch(url, { ...opts, method, headers });
  if (res.status === 401) { window.location.href = '/login.html'; return null; }
  return res;
}

function showAlert(el, msg, type = 'error') {
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 6000);
}

function jsonBlock(data) {
  const pre = document.createElement('pre');
  pre.className = 'result-box';
  pre.textContent = JSON.stringify(data, null, 2);
  return pre;
}

function getActiveInstance() {
  return document.getElementById('active-instance').value;
}

// ===== Session check =====
async function checkSession() {
  const res = await fetch('/auth/session');
  const data = await res.json();
  if (!data.authenticated) {
    window.location.href = '/login.html';
    return;
  }
  csrfToken = data.csrfToken;
  sessionStorage.setItem('csrfToken', csrfToken);
  document.getElementById('topbar-user').textContent = data.username;
}

// ===== Logout =====
document.getElementById('logout-btn').addEventListener('click', async () => {
  await apiFetch('/auth/logout', { method: 'POST' });
  sessionStorage.clear();
  window.location.href = '/login.html';
});

// ===== Instances =====
async function loadInstances() {
  const res = await apiFetch('/api/instances');
  if (!res) return;
  instances = await res.json();
  renderInstances();
  renderInstanceSelector();
}

function maskBadge(instance) {
  return `<span style="color:var(--text-muted);font-size:11px;font-family:monospace;">${instance.clientIdMasked}</span>`;
}

function renderInstances() {
  const list = document.getElementById('instances-list');
  if (instances.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;margin-bottom:14px;">No instances added yet.</p>';
    return;
  }
  list.innerHTML = instances.map(inst => `
    <div class="instance-row" id="inst-${inst.id}">
      <div class="instance-row-header">
        <span class="instance-name">${escHtml(inst.name)}</span>
        <div class="instance-row-actions">
          <button class="btn btn-ghost btn-sm" onclick="testInstance('${inst.id}')">Test</button>
          <button class="btn btn-danger btn-sm" onclick="deleteInstance('${inst.id}')">Delete</button>
        </div>
      </div>
      <div class="instance-meta">
        <span>${escHtml(inst.apiBase)}</span>
        <span>Client ID: ${maskBadge(inst)}</span>
        <span>Scope: ${escHtml(inst.scope)}</span>
      </div>
    </div>
  `).join('');
}

function renderInstanceSelector() {
  const sel = document.getElementById('active-instance');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— select an instance —</option>' +
    instances.map(i => `<option value="${i.id}" ${cur === i.id ? 'selected' : ''}>${escHtml(i.name)}</option>`).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Add instance form
const addToggle = document.getElementById('add-toggle');
const addFormWrap = document.getElementById('add-form-wrap');
addToggle.addEventListener('click', () => {
  addToggle.classList.toggle('open');
  addFormWrap.classList.toggle('open');
});

document.getElementById('add-instance-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  const res = await apiFetch('/api/instances', { method: 'POST', body: JSON.stringify(body) });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) {
    showAlert(document.getElementById('add-error'), data.error || 'Failed to add instance');
    return;
  }
  showAlert(document.getElementById('add-success'), `Instance "${data.name}" added.`, 'success');
  e.target.reset();
  addToggle.classList.remove('open');
  addFormWrap.classList.remove('open');
  loadInstances();
});

// Test instance
async function testInstance(id) {
  const row = document.getElementById(`inst-${id}`);
  const btn = row.querySelector('[onclick*="testInstance"]');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  const res = await apiFetch(`/api/instances/${id}/test`, { method: 'POST' });
  btn.disabled = false;
  btn.textContent = 'Test';
  if (!res) return;
  const data = await res.json();
  const badge = document.createElement('span');
  badge.className = data.ok ? 'badge badge-ok' : 'badge badge-fail';
  badge.textContent = data.ok ? '✓ OK' : '✗ Failed';
  badge.title = data.message;
  const existing = row.querySelector('.badge');
  if (existing) existing.remove();
  row.querySelector('.instance-row-header').appendChild(badge);
}

// Delete instance
async function deleteInstance(id) {
  if (!confirm('Delete this instance? This cannot be undone.')) return;
  const res = await apiFetch(`/api/instances/${id}`, { method: 'DELETE' });
  if (!res) return;
  if (!res.ok) { alert('Failed to delete instance'); return; }
  loadInstances();
}

// ===== Tabs =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

// ===== End Users =====
document.getElementById('eu-search-btn').addEventListener('click', async () => {
  const email = document.getElementById('eu-search-email').value.trim();
  if (!email) return;
  const iid = getActiveInstance();
  if (!iid) { alert('Select an instance first.'); return; }
  const res = await apiFetch(`/api/actions/${iid}/end-users/search?email=${encodeURIComponent(email)}`);
  if (!res) return;
  const data = await res.json();
  const el = document.getElementById('eu-search-result');
  el.innerHTML = '';
  if (!res.ok) { el.appendChild(jsonBlock({ error: data.error })); return; }
  el.appendChild(jsonBlock(data));
});

document.getElementById('create-eu-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const iid = getActiveInstance();
  if (!iid) { alert('Select an instance first.'); return; }
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  if (!body.roleName) delete body.roleName;
  const res = await apiFetch(`/api/actions/${iid}/end-users`, { method: 'POST', body: JSON.stringify(body) });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) {
    showAlert(document.getElementById('eu-create-error'), data.error || 'Failed to create user');
    return;
  }
  let msg = `Created end user: ${data.user?.email}`;
  if (data.roleError) msg += ` (role error: ${data.roleError})`;
  else if (data.roleAssigned) msg += ' — role assigned';
  showAlert(document.getElementById('eu-create-success'), msg, 'success');
  e.target.reset();
});

// ===== Technicians =====
document.getElementById('create-tech-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const iid = getActiveInstance();
  if (!iid) { alert('Select an instance first.'); return; }
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  if (!body.roleName) delete body.roleName;
  const res = await apiFetch(`/api/actions/${iid}/technicians`, { method: 'POST', body: JSON.stringify(body) });
  if (!res) return;
  const data = await res.json();
  if (!res.ok) {
    showAlert(document.getElementById('tech-create-error'), data.error || 'Failed to create technician');
    return;
  }
  let msg = `Created technician: ${data.user?.email}`;
  if (data.roleError) msg += ` (role error: ${data.roleError})`;
  else if (data.roleAssigned) msg += ' — role assigned';
  showAlert(document.getElementById('tech-create-success'), msg, 'success');
  e.target.reset();
});

// ===== Devices =====
document.getElementById('dev-search-btn').addEventListener('click', async () => {
  const name = document.getElementById('dev-search-name').value.trim();
  if (!name) return;
  const iid = getActiveInstance();
  if (!iid) { alert('Select an instance first.'); return; }
  const res = await apiFetch(`/api/actions/${iid}/devices/search?name=${encodeURIComponent(name)}`);
  if (!res) return;
  const data = await res.json();
  const el = document.getElementById('dev-search-result');
  el.innerHTML = '';
  if (!res.ok) { el.appendChild(jsonBlock({ error: data.error })); return; }
  if (Array.isArray(data) && data.length > 0) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const table = document.createElement('table');
    table.className = 'data-table';
    table.innerHTML = `<thead><tr><th>ID</th><th>Hostname</th></tr></thead>
      <tbody>${data.map(d => `<tr><td>${escHtml(String(d.id))}</td><td>${escHtml(d.systemName)}</td></tr>`).join('')}</tbody>`;
    wrap.appendChild(table);
    el.appendChild(wrap);
  } else {
    el.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">No devices found.</p>';
  }
});

// ===== Device-User Report =====
document.getElementById('report-view-btn').addEventListener('click', async () => {
  const iid = getActiveInstance();
  if (!iid) { alert('Select an instance first.'); return; }
  const btn = document.getElementById('report-view-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Loading…';
  const res = await apiFetch(`/api/actions/${iid}/device-user-mapping`);
  btn.disabled = false;
  btn.textContent = 'View as table';
  if (!res) return;
  const data = await res.json();
  const el = document.getElementById('report-result');
  el.innerHTML = '';
  if (!res.ok) { el.appendChild(jsonBlock({ error: data.error })); return; }
  if (!Array.isArray(data) || data.length === 0) {
    el.innerHTML = '<p style="color:var(--text-muted);">No data.</p>';
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const table = document.createElement('table');
  table.className = 'data-table';
  table.innerHTML = `<thead><tr>
    <th>Device ID</th><th>Hostname</th><th>OS</th>
    <th>User ID</th><th>First</th><th>Last</th><th>Email</th>
  </tr></thead><tbody>${data.map(r => `<tr>
    <td>${escHtml(String(r.deviceId))}</td>
    <td style="${r.hostname==='(device not found)'?'color:var(--danger)':''}">${escHtml(r.hostname)}</td>
    <td>${escHtml(r.os||'')}</td>
    <td>${escHtml(String(r.userId))}</td>
    <td>${escHtml(r.firstName)}</td>
    <td>${escHtml(r.lastName)}</td>
    <td>${escHtml(r.userEmail)}</td>
  </tr>`).join('')}</tbody>`;
  wrap.appendChild(table);
  el.appendChild(wrap);
});

document.getElementById('report-csv-btn').addEventListener('click', async () => {
  const iid = getActiveInstance();
  if (!iid) { alert('Select an instance first.'); return; }
  // Navigate directly for file download
  window.location.href = `/api/actions/${iid}/device-user-mapping?format=csv`;
});

// ===== Init =====
(async function init() {
  await checkSession();
  await loadInstances();
})();
</script>
</body>
</html>
