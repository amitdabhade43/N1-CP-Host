<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NinjaOne Control Panel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-brand">NinjaOne <span>Control Panel</span></div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="main">
    <!-- Left panel: Instances -->
    <div class="panel">
      <h2>Instances</h2>
      <div id="instances-list"></div>

      <!-- Add instance -->
      <button class="collapsible-trigger" id="add-toggle">
        + Add instance <span class="arrow">&#9662;</span>
      </button>
      <div class="collapsible-body" id="add-form-wrap">
        <div id="add-error" class="alert alert-error hidden"></div>
        <div id="add-success" class="alert alert-success hidden"></div>
        <form id="add-instance-form">
          <div class="field">
            <label>Display name</label>
            <input type="text" name="name" placeholder="Contoso EU" required />
          </div>
          <div class="field">
            <label>API base URL</label>
            <input type="url" name="apiBase" placeholder="https://eu.ninjarmm.com" required />
          </div>
          <div class="field">
            <label>Auth URL (OAuth token host)</label>
            <input type="url" name="authUrl" placeholder="https://remote.rmmservice.eu" required />
          </div>
          <div class="field">
            <label>Client ID</label>
            <input type="text" name="clientId" required autocomplete="off" />
          </div>
          <div class="field">
            <label>Client Secret</label>
            <input type="password" name="clientSecret" required autocomplete="off" />
          </div>
          <div class="field">
            <label>Scope</label>
            <input type="text" name="scope" value="management control monitoring" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full">Save instance</button>
        </form>
      </div>
    </div>

    <!-- Right content: Actions -->
    <div class="content">
      <!-- Instance selector -->
      <div class="instance-select-row">
        <label>Active instance:</label>
        <select id="active-instance">
          <option value="">&#8212; select an instance &#8212;</option>
        </select>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="end-users">End Users</button>
        <button class="tab-btn" data-tab="technicians">Technicians</button>
        <button class="tab-btn" data-tab="devices">Devices</button>
        <button class="tab-btn" data-tab="report">Device-User Report</button>
      </div>

      <!-- End Users tab -->
      <div class="tab-pane active" id="tab-end-users">
        <div class="section-heading">Search end users</div>
        <div style="display:flex;gap:8px;margin-bottom:20px;">
          <input type="text" id="eu-search-email" placeholder="Search by email..." style="max-width:300px;" />
          <button class="btn btn-primary" id="eu-search-btn">Search</button>
        </div>
        <div id="eu-search-result"></div>

        <div class="section-heading" style="margin-top:28px;">Create end user</div>
        <div id="eu-create-error" class="alert alert-error hidden"></div>
        <div id="eu-create-success" class="alert alert-success hidden"></div>
        <form id="create-eu-form">
          <div class="row">
            <div class="field"><label>First name</label><input type="text" name="firstName" required /></div>
            <div class="field"><label>Last name</label><input type="text" name="lastName" required /></div>
          </div>
          <div class="row">
            <div class="field"><label>Email</label><input type="email" name="email" required /></div>
            <div class="field"><label>Role name (optional)</label><input type="text" name="roleName" placeholder="e.g. Standard User" /></div>
          </div>
          <button type="submit" class="btn btn-primary">Create end user</button>
        </form>
      </div>

      <!-- Technicians tab -->
      <div class="tab-pane" id="tab-technicians">
        <div class="section-heading">Create technician</div>
        <div id="tech-create-error" class="alert alert-error hidden"></div>
        <div id="tech-create-success" class="alert alert-success hidden"></div>
        <form id="create-tech-form">
          <div class="row">
            <div class="field"><label>First name</label><input type="text" name="firstName" required /></div>
            <div class="field"><label>Last name</label><input type="text" name="lastName" required /></div>
          </div>
          <div class="row">
            <div class="field"><label>Email</label><input type="email" name="email" required /></div>
            <div class="field"><label>Role name (optional)</label><input type="text" name="roleName" placeholder="e.g. Admin" /></div>
          </div>
          <button type="submit" class="btn btn-primary">Create technician</button>
        </form>
      </div>

      <!-- Devices tab -->
      <div class="tab-pane" id="tab-devices">
        <div class="section-heading">Find device</div>
        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <input type="text" id="dev-search-name" placeholder="Device name or partial name..." style="max-width:340px;" />
          <button class="btn btn-primary" id="dev-search-btn">Search</button>
        </div>
        <div id="dev-search-result"></div>
      </div>

      <!-- Device-User Report tab -->
      <div class="tab-pane" id="tab-report">
        <div class="section-heading">Device-User Mapping Report</div>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">
          Fetches all devices and end users and joins them in-memory. Rows with stale device IDs show "(device not found)".
        </p>
        <div style="display:flex;gap:8px;margin-bottom:20px;">
          <button class="btn btn-primary" id="report-view-btn">View as table</button>
          <button class="btn btn-ghost" id="report-csv-btn">Download CSV</button>
        </div>
        <div id="report-result"></div>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
