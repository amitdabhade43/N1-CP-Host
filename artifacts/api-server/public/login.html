<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NinjaOne Control Panel — Login</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>NinjaOne <span style="color:var(--accent)">Control Panel</span></h1>
      <p class="subtitle">Multi-tenant RMM automation dashboard</p>

      <div id="error-msg" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Sign in</button>
      </form>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
